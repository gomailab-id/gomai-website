<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ringkasan & Unduh | Gomai</title>
    <meta name="description" content="Ringkasan & Unduh Gomai">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/commerce.css">
</head>
<body data-page="checkout">
    <header id="site-header"></header>
    <main class="commerce-page checkout-page" id="main-content">
        <div class="commerce-shell">
            <header class="commerce-heading"><div><h1 data-lang="checkout.title">Ringkasan & Unduh</h1><p data-lang="checkout.subtitle">Lengkapi informasi pengantaran lalu unduh kartu pesanan Gomai.</p></div></header>
            <div id="checkout-empty" class="commerce-empty" hidden></div>
            <div id="checkout-content" class="checkout-layout" hidden>
                <section>
                    <div class="checkout-panel"><h2 data-lang="checkout.informationTitle">Informasi Pengantaran</h2>
                        <form id="checkout-form" class="checkout-form" novalidate>
                            <div class="checkout-field"><label for="checkout-name" data-lang="checkout.name">Nama</label><input id="checkout-name" name="name" autocomplete="name" data-lang-placeholder="checkout.namePlaceholder"></div>
                            <div class="checkout-field"><label for="checkout-wechat" data-lang="checkout.wechatId">WeChat ID</label><input id="checkout-wechat" name="wechat" autocomplete="off" data-lang-placeholder="checkout.wechatPlaceholder"></div>
                            <div class="checkout-field is-full"><label for="checkout-location" data-lang="checkout.location">Lokasi Pengantaran</label><input id="checkout-location" name="location" autocomplete="street-address" data-lang-placeholder="checkout.locationPlaceholder"></div>
                            <div class="checkout-field is-full"><label for="checkout-schedule" data-lang="checkout.schedule">Waktu Pengantaran</label><input id="checkout-schedule" name="schedule" autocomplete="off" data-lang-placeholder="checkout.schedulePlaceholder"></div>
                            <div class="checkout-field is-full"><label for="checkout-notes" data-lang="checkout.notes">Catatan</label><textarea id="checkout-notes" name="notes" data-lang-placeholder="checkout.notesPlaceholder"></textarea></div>
                        </form>
                    </div>
                    <div class="checkout-card-preview" id="checkout-preview"></div>
                </section>
                <aside class="checkout-panel"><h2 data-lang="checkout.orderSummary">Ringkasan Pesanan</h2><div id="checkout-order-list" class="checkout-order-list"></div><div id="checkout-total" class="checkout-preview-total"></div><div class="checkout-download"><h3 data-lang="checkout.downloadTitle">Pilih Bahasa Kartu Pesanan</h3><p data-lang="checkout.downloadDescription">Kartu akan diunduh sebagai PNG dan dapat langsung dikirim melalui WeChat.</p><div class="download-grid"><button id="download-order-id" class="btn btn-primary" type="button">🇮🇩 <span data-lang="checkout.downloadId">Unduh Bahasa Indonesia</span></button><button id="download-order-zh" class="btn btn-secondary" type="button">中文 <span data-lang="checkout.downloadZh">下载中文版</span></button><a id="checkout-wechat-link" class="btn btn-ghost" href="contact.html" data-lang="checkout.contactWechat">Hubungi WeChat Gomai</a></div><p id="checkout-message" class="checkout-message" role="status" aria-live="polite"></p></div></aside>
            </div>
        </div>
    </main>
    <footer id="site-footer"></footer>

    <script src="../js/config.js"></script>
    <script src="../js/core/utils.js"></script>
    <script src="../js/language.js"></script>
    <script src="../js/shopping-state.js"></script>
    <script src="../js/core/component-core.js"></script>
    <script src="../js/core/model-registry.js"></script>
    <script src="../js/core/component-registry.js"></script>
    <script src="../js/core/controller-registry.js"></script>
    <script src="../js/models/brands.js"></script>
    <script src="../js/models/categories.js"></script>
    <script src="../js/models/products.js"></script>
    <script src="../js/components/loading.js"></script>
    <script src="../js/components/empty-state.js"></script>
    <script src="../js/components/product-card.js"></script>
    <script src="../js/components/brand-card.js"></script>
    <script src="../js/components/search-panel.js"></script>
    <script src="../js/components/header.js"></script>
    <script src="../js/components/footer.js"></script>
    <script src="../js/checkout.js"></script>
    <script src="../js/core/gomai.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
