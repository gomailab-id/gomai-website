<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Titipan | Gomai</title>
    <meta name="description" content="Daftar produk yang ingin dititipbelikan melalui Gomai">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/commerce.css">
</head>
<body data-page="cart">
    <header id="site-header"></header>
    <main class="commerce-page cart-page" id="main-content">
        <div class="commerce-shell">
            <header class="commerce-heading">
                <div><h1><span data-lang="cart.title">Daftar Titipan</span> <span id="cart-count" class="commerce-count">0</span></h1><p data-lang="cart.subtitle">Periksa produk dan sumber resmi sebelum membuat kartu estimasi.</p></div>
            </header>
            <div id="cart-empty" class="commerce-empty" hidden></div>
            <div id="cart-content" hidden>
                <div class="service-separation-note" data-lang="orderServices.separateCheckout">Gomai Express dan Official Order diproses melalui checkout terpisah agar ongkir dan waktu layanan tidak tercampur.</div>
                <div id="cart-service-groups" class="cart-service-groups"></div>
                <div class="cart-footer-actions"><a class="btn btn-secondary" href="products.html" data-lang="cart.continueShopping">Cari Produk</a><button id="cart-clear" class="btn btn-ghost" type="button" data-lang="cart.removeAll">Kosongkan Semua</button></div>
            </div>
        </div>
    </main>
    <footer id="site-footer"></footer>

    <script src="../js/config.js"></script>
    <script src="../js/core/utils.js"></script>
    <script src="../js/language.js"></script>
    <script src="../js/shopping-state.js"></script>
    <script src="../js/assisted-shopping.js"></script>
    <script src="../js/core/component-core.js"></script>
    <script src="../js/core/model-registry.js"></script>
    <script src="../js/core/component-registry.js"></script>
    <script src="../js/core/controller-registry.js"></script>
    <script src="../js/models/brands.js"></script>
    <script src="../js/models/categories.js"></script>
    <script src="../js/models/products.js"></script>
    <script src="../js/components/loading.js"></script>
    <script src="../js/components/empty-state.js"></script>
    <script src="../js/components/product-card.js"></script>
    <script src="../js/components/brand-card.js"></script>
    <script src="../js/components/search-panel.js"></script>
    <script src="../js/components/header.js"></script>
    <script src="../js/components/footer.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/core/gomai.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
