<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist | Gomai</title>
    <meta name="description" content="Wishlist Gomai">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/commerce.css">
</head>
<body data-page="wishlist">
    <header id="site-header"></header>
    <main class="commerce-page wishlist-page" id="main-content">
        <div class="commerce-shell">
            <header class="commerce-heading"><div><h1><span data-lang="wishlist.title">Wishlist</span> <span id="wishlist-count" class="commerce-count">0</span></h1><p data-lang="wishlist.subtitle">Simpan produk favorit Anda</p></div></header>
            <div class="wishlist-toolbar"><button id="wishlist-clear" class="btn btn-secondary" type="button" data-lang="wishlist.clearAll">Hapus Semua</button></div>
            <div id="wishlist-empty" class="commerce-empty" hidden></div>
            <section id="wishlist-grid" class="wishlist-grid"></section>
        </div>
    </main>
    <footer id="site-footer"></footer>

    <script src="../js/config.js"></script>
    <script src="../js/core/utils.js"></script>
    <script src="../js/language.js"></script>
    <script src="../js/shopping-state.js"></script>
    <script src="../js/core/component-core.js"></script>
    <script src="../js/core/model-registry.js"></script>
    <script src="../js/core/component-registry.js"></script>
    <script src="../js/core/controller-registry.js"></script>
    <script src="../js/models/brands.js"></script>
    <script src="../js/models/categories.js"></script>
    <script src="../js/models/products.js"></script>
    <script src="../js/components/loading.js"></script>
    <script src="../js/components/empty-state.js"></script>
    <script src="../js/components/product-card.js"></script>
    <script src="../js/components/brand-card.js"></script>
    <script src="../js/components/search-panel.js"></script>
    <script src="../js/components/header.js"></script>
    <script src="../js/components/footer.js"></script>
    <script src="../js/wishlist.js"></script>
    <script src="../js/core/gomai.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
