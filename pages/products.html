<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Semua Produk | Gomai</title>
    <meta
        id="page-description"
        name="description"
        content="Jelajahi seluruh produk Gomai dari empat kategori utama."
    >
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/products.css">
</head>

<body data-page="products">

    <header id="site-header"></header>

    <main
        id="products-page"
        class="products-page products-simple-page"
    >

        <section class="products-simple-intro">
            <div class="container">
                <div class="products-simple-intro-content">

                    <span
                        id="products-context-label"
                        class="products-simple-overline"
                        data-lang="productsPage.catalogLabel"
                    >
                        Katalog
                    </span>

                    <h1
                        id="products-title"
                        data-lang="common.allProducts"
                    >
                        Semua Produk
                    </h1>

                    <p
                        id="products-description"
                        data-lang="productsPage.meta.description"
                    >
                        Jelajahi seluruh produk Gomai dari empat kategori utama.
                    </p>

                </div>
            </div>
        </section>


        <section
            class="products-simple-catalog"
            id="product-catalog"
        >
            <div class="container">

                <div class="products-simple-toolbar">

                    <p
                        id="products-result-count"
                        class="products-simple-result-count"
                        aria-live="polite"
                    >
                        Memuat produk...
                    </p>

                    <div class="products-simple-controls">

                        <div class="products-simple-filter">
                            <label
                                for="products-brand-filter"
                                data-lang="productsPage.filter.brandLabel"
                            >
                                Brand
                            </label>

                            <select
                                id="products-brand-filter"
                                class="filter-select"
                                name="brand"
                            >
                                <option
                                    value="all"
                                    data-lang="productsPage.filter.allBrands"
                                >
                                    Semua Brand
                                </option>
                            </select>
                        </div>

                        <div class="products-simple-filter">
                            <label
                                for="products-sort"
                                data-lang="productsPage.filter.sortLabel"
                            >
                                Urutkan
                            </label>

                            <select
                                id="products-sort"
                                class="filter-select"
                                name="sort"
                            >
                                <option
                                    value="default"
                                    data-lang="productsPage.filter.default"
                                >
                                    Urutan Default
                                </option>

                                <option
                                    value="price-low"
                                    data-lang="productsPage.filter.priceLow"
                                >
                                    Harga Terendah
                                </option>

                                <option
                                    value="price-high"
                                    data-lang="productsPage.filter.priceHigh"
                                >
                                    Harga Tertinggi
                                </option>

                                <option
                                    value="name-asc"
                                    data-lang="productsPage.filter.nameAscending"
                                >
                                    Nama A–Z
                                </option>

                                <option
                                    value="name-desc"
                                    data-lang="productsPage.filter.nameDescending"
                                >
                                    Nama Z–A
                                </option>

                                <option
                                    value="featured"
                                    data-lang="productsPage.filter.featured"
                                >
                                    Produk Unggulan
                                </option>
                            </select>
                        </div>

                    </div>

                </div>


                <div
                    id="products-grid"
                    class="product-grid products-grid products-page-grid"
                    aria-live="polite"
                    aria-busy="true"
                >
                    <div class="empty-state">
                        <p data-lang="productsPage.loading">
                            Memuat produk...
                        </p>
                    </div>
                </div>

            </div>
        </section>

    </main>

    <footer id="site-footer"></footer>

    <script src="../js/config.js"></script>
    <script src="../js/core/utils.js"></script>
    <script src="../js/language.js"></script>
    <script src="../js/shopping-state.js"></script>

    <script src="../js/core/component-core.js"></script>
    <script src="../js/core/model-registry.js"></script>
    <script src="../js/core/component-registry.js"></script>
    <script src="../js/core/controller-registry.js"></script>

    <script src="../js/models/brands.js"></script>
    <script src="../js/models/categories.js"></script>
    <script src="../js/models/products.js"></script>

    <script src="../js/components/loading.js"></script>
    <script src="../js/components/empty-state.js"></script>
    <script src="../js/components/product-card.js"></script>
    <script src="../js/components/brand-card.js"></script>
    <script src="../js/components/search-panel.js"></script>
    <script src="../js/components/header.js"></script>
    <script src="../js/components/footer.js"></script>

    <script src="../js/products.js"></script>
    <script src="../js/core/gomai.js"></script>
    <script src="../js/app.js"></script>

</body>
</html>
