<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Hubungi Gomai | Gomai</title>
    <meta
        name="description"
        content="Hubungi Gomai melalui WeChat."
    >
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/information.css">
</head>
<body
    data-page="information"
    data-information-page="contact"
>
    <header id="site-header"></header>

    <main
        class="information-simple-page information-simple-contact"
        data-information-page-root
    >

        <section class="information-simple-hero">
            <div class="container information-simple-hero-inner">
                <span
                    class="information-simple-kicker"
                    data-lang="contactPage.hero.badge"
                >
                    Hubungi Gomai
                </span>

                <h1 data-lang="contactPage.hero.title">
                    Hubungi Gomai melalui WeChat
                </h1>

                <p data-lang="contactPage.hero.description">
                    Scan QR atau salin WeChat ID untuk menghubungi Gomai.
                </p>
            </div>
        </section>

        <section class="information-simple-section">
            <div class="container">
                <article class="information-simple-contact-card">

                    <div class="information-simple-contact-copy">
                        <span
                            class="information-simple-kicker"
                            data-lang="contactPage.wechat.badge"
                        >
                            WeChat
                        </span>

                        <h2 data-lang="contactPage.wechat.title">
                            Scan QR WeChat Gomai
                        </h2>

                        <p data-lang="contactPage.wechat.description">
                            Gunakan QR atau salin WeChat ID di bawah ini.
                        </p>

                        <div class="information-simple-wechat-id">
                            <div>
                                <span data-lang="contactPage.wechat.idLabel">
                                    WeChat ID
                                </span>
                                <strong data-wechat-id>
                                    Gomai
                                </strong>
                            </div>

                            <button
                                type="button"
                                class="information-simple-copy-button"
                                data-copy-wechat
                            >
                                <span
                                    data-copy-label
                                    data-lang="contactPage.wechat.copy"
                                >
                                    Salin
                                </span>
                            </button>
                        </div>
                    </div>

                    <div class="information-simple-qr-shell">
                        <img
                            src="../assets/gomai/wechat-qr.png"
                            alt="WeChat QR Gomai"
                            data-lang-alt="contactPage.wechat.qrAlt"
                        >
                    </div>

                </article>
            </div>
        </section>

    <footer id="site-footer"></footer>

    <script src="../js/config.js"></script>
    <script src="../js/core/utils.js"></script>
    <script src="../js/language.js"></script>
    <script src="../js/shopping-state.js"></script>

    <script src="../js/core/component-core.js"></script>
    <script src="../js/core/model-registry.js"></script>
    <script src="../js/core/component-registry.js"></script>
    <script src="../js/core/controller-registry.js"></script>

    <script src="../js/models/brands.js"></script>
    <script src="../js/models/categories.js"></script>
    <script src="../js/models/products.js"></script>

    <script src="../js/components/loading.js"></script>
    <script src="../js/components/empty-state.js"></script>
    <script src="../js/components/product-card.js"></script>
    <script src="../js/components/brand-card.js"></script>
    <script src="../js/components/search-panel.js"></script>
    <script src="../js/components/header.js"></script>
    <script src="../js/components/footer.js"></script>

    <script src="../js/information.js"></script>
    <script src="../js/core/gomai.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
