<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Detail Produk | Gomai</title>

    <meta
        id="page-description"
        name="description"
        content="Lihat foto, harga, varian, stok, dan informasi produk di Gomai."
    >

    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/product-detail.css">
</head>

<body data-page="productDetail">

    <header id="site-header"></header>


    <main
        id="product-detail-page"
        class="product-detail-page"
    >

        <!-- ==============================================
             COMPACT BREADCRUMB
        =============================================== -->

        <div class="product-breadcrumb-section">
            <div class="container">

                <nav
                    class="breadcrumb"
                    aria-label="Breadcrumb"
                >
                    <a
                        href="../index.html"
                        data-lang="common.home"
                    >
                        Beranda
                    </a>

                    <span aria-hidden="true">/</span>

                    <a
                        href="products.html"
                        data-lang="productDetail.breadcrumbProducts"
                    >
                        Produk
                    </a>

                    <span aria-hidden="true">/</span>

                    <span
                        id="breadcrumb-product-name"
                        aria-current="page"
                        data-lang="product.loading"
                    >
                        Memuat produk...
                    </span>
                </nav>

            </div>
        </div>


        <!-- ==============================================
             PRODUCT
             Gallery + product essentials + cart/wishlist.
             Dynamic content is rendered by controller.
        =============================================== -->

        <section class="product-detail-section">
            <div class="container">

                <div
                    id="product-detail"
                    class="product-detail"
                    aria-live="polite"
                    aria-busy="true"
                >
                    <div class="empty-state">
                        <p data-lang="product.loading">
                            Memuat produk...
                        </p>
                    </div>
                </div>

            </div>
        </section>


        <!-- ==============================================
             PRODUCT INFORMATION ONLY
        =============================================== -->

        <section
            id="product-information-section"
            class="product-information-section"
            hidden
        >
            <div class="container">

                <div class="product-information-panel">

                    <h2
                        class="product-information-heading"
                        data-lang="productDetail.informationTitle"
                    >
                        Informasi Produk
                    </h2>


                    <div
                        id="product-description"
                        class="product-information-part product-description-section"
                        hidden
                    >
                        <h3
                            id="product-description-title"
                            data-lang="productDetail.descriptionTitle"
                        >
                            Deskripsi Produk
                        </h3>

                        <div
                            id="product-description-text"
                            class="product-description-text"
                        ></div>
                    </div>


                    <div
                        id="product-specification"
                        class="product-information-part product-specification-section"
                        hidden
                    >
                        <h3
                            id="product-specification-title"
                            data-lang="productDetail.specificationTitle"
                        >
                            Spesifikasi
                        </h3>

                        <dl
                            id="product-specification-list"
                            class="product-specification-list"
                        ></dl>
                    </div>

                </div>

            </div>
        </section>


        <!-- ==============================================
             PRODUCT NOT FOUND
        =============================================== -->

        <section
            id="product-not-found"
            class="product-not-found"
            hidden
        >
            <div class="container">

                <div class="empty-state">

                    <h1
                        id="product-not-found-title"
                        data-lang="productDetail.notFound.title"
                    >
                        Produk Tidak Ditemukan
                    </h1>

                    <p
                        id="product-not-found-description"
                        data-lang="productDetail.notFound.description"
                    >
                        Produk yang Anda cari belum tersedia atau
                        alamat halaman tidak valid.
                    </p>

                    <a
                        id="product-not-found-button"
                        href="products.html"
                        class="btn btn-primary"
                        data-lang="productDetail.notFound.button"
                    >
                        Lihat Semua Produk
                    </a>

                </div>

            </div>
        </section>

    </main>


    <footer id="site-footer"></footer>


    <script src="../js/config.js"></script>
    <script src="../js/core/utils.js"></script>
    <script src="../js/language.js"></script>
    <script src="../js/shopping-state.js"></script>

    <script src="../js/core/component-core.js"></script>
    <script src="../js/core/model-registry.js"></script>
    <script src="../js/core/component-registry.js"></script>
    <script src="../js/core/controller-registry.js"></script>

    <script src="../js/models/brands.js"></script>
    <script src="../js/models/categories.js"></script>
    <script src="../js/models/products.js"></script>

    <script src="../js/components/loading.js"></script>
    <script src="../js/components/empty-state.js"></script>
    <script src="../js/components/product-card.js"></script>
    <script src="../js/components/brand-card.js"></script>
    <script src="../js/components/search-panel.js"></script>
    <script src="../js/components/header.js"></script>
    <script src="../js/components/footer.js"></script>

    <script src="../js/product-detail.js"></script>
    <script src="../js/core/gomai.js"></script>
    <script src="../js/app.js"></script>

</body>
</html>
